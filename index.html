<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Cotizaciones Eléctricas</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-brand">
        <span class="app-logo">⚡</span>
        <div>
          <h1 class="app-titulo">Cotizaciones Eléctricas</h1>
          <span class="app-subtitulo">Herramienta interna · CLP</span>
        </div>
      </div>
      <nav class="nav-tabs" role="tablist">
        <button class="nav-tab activo" role="tab" data-vista="catalogo" aria-selected="true">📋 Catálogo</button>
        <button class="nav-tab" role="tab" data-vista="cotizacion" aria-selected="false">🧾 Cotización</button>
        <button class="nav-tab" role="tab" data-vista="guardadas" aria-selected="false">💾 Guardadas</button>
      </nav>
      <button class="btn-icono btn-tema" id="btn-tema" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <main class="app-main">
    <section id="vista" class="vista"></section>
  </main>

  <footer class="app-footer">
    Herramienta interna · Montos en pesos chilenos (CLP) · Precios <strong>referenciales</strong>, validar con proveedor antes de enviar al cliente.
  </footer>

  <!-- Contenedor oculto para impresión / PDF (se llena al imprimir) -->
  <div id="area-impresion" aria-hidden="true"></div>

  <!-- SheetJS con soporte de estilos (fork xlsx-js-style), vía CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
